<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeveloperBingo</title>
    <!-- Sets the theme before the page first paints. The same rule lives in src/theme.ts; this copy has
         to run before any module does. -->
    <script>
      ;(function () {
        var theme = 'light'
        try {
          var stored = localStorage.getItem('devbingo-theme')
          if (stored === 'light' || stored === 'dark') theme = stored
          else if (window.matchMedia('(prefers-color-scheme: dark)').matches)
            theme = 'dark'
        } catch (e) {
          // Storage or matchMedia blocked: stay on the light theme.
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
